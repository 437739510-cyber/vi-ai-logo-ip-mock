name: Keep Alive

on:
  schedule:
    # 每10分钟ping一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Brand Brain
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://brandbrain.zeabur.app/)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "WARNING: Site returned $HTTP_CODE"
            exit 1
          fi
          echo "Site is alive ✅"
